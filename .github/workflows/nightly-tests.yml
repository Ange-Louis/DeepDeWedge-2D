name: Generation Nocturne de Tests

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  generate-tests:
    name: Generer les Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.13"
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Create tests directory if not exists
        run: mkdir -p tests
      
      - name: Run test generator
        run: |
          python scripts/nightly_test_generator.py || true
      
      - name: Check for new tests
        id: check_tests
        run: |
          if [ -n "$(git status --porcelain tests/)" ]; then
            echo "HAS_NEW_TESTS=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_NEW_TESTS=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push new tests
        if: steps.check_tests.outputs.HAS_NEW_TESTS == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add tests/
          git commit -m "chore: auto-generated tests"
          git push origin HEAD:auto/generated-tests-${{ github.sha }}
      
      - name: Create Pull Request
        if: steps.check_tests.outputs.HAS_NEW_TESTS == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-generated tests"
          title: "chore: auto-generated tests"
          body: |
            Tests automatiquement generes
          branch: "auto/generated-tests-${{ github.sha }}"
          base: main
