shared:
  tomo0_files: 
    - "tutorial/tutorial_data/tomo_even_frames.mrc"
  tomo1_files: 
    - "tutorial/tutorial_data/tomo_odd_frames.mrc"
  mw_angle: 50
  standardize_full_tomos: false
  num_workers: 8
  gpu: [0]
  seed: 42

prepare_data:
  mask_files: []
  # STRIDES 2D ! Adapte l'extraction pour des images 2D
  subtomo_extraction_strides: [80, 3800] 
  val_fraction: 0.1
  extract_larger_subtomos_for_rotating: false

fit_model2:
  unet_params_dict:
    chans: 64
    num_downsample_layers: 3
    drop_prob: 0.3
  adam_params_dict: 
    lr: 0.004
  num_epochs: 400
  batch_size: 64
  update_subtomo_missing_wedges_every_n_epochs: 9999
  check_val_every_n_epochs: 1
  save_n_models_with_lowest_val_loss: 1
  save_n_models_with_lowest_fitting_loss: 0
  save_model_every_n_epochs: 9999 

refine_tomogram:
  batch_size: 10
  recompute_normalization: false
  