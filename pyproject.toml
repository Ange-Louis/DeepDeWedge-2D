[project]
name = "DDW2"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
	"numpy>=2.4.3,<3",
	"pillow>=12.2.0,<13",
	"mrcfile>=1.5.4,<2", 
	"typer",
	"typer-cli",
	"typer-config",
	"typer-slim",
	"matplotlib",
	"torchvision",
	"pytorch-lightning",
	"scipy",
	]

[tool.pixi.workspace]
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["linux-64"]


[tool.pixi.dependencies]
pytorch = "*"
pytorch-cuda = "12.1.*"
tensorboard = ">=2.19.0,<3"
setuptools = "<70"

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"

[tool.pixi.feature.test.tasks]
test = "pytest tests/ --cov=DeepDeWedge2"


[tool.pixi.environments]
default = ["test"]
production = []
